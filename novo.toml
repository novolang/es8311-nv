[package]
name        = "es8311-nv"
version     = "0.1.0"
description = "A driver for Everest Semiconductor's ES8311 mono audio codec on an I2C control bus and a board's I2S handle: the chip ID, the clock manager with its divider and multiplier plan for 8 to 96 kHz from MCLK or SCLK, the serial port in I2S, left-justified and DSP formats, the DAC and ADC paths with volume, mute and the microphone gain, and the named power-up and power-down steps, as devices-nv's AudioCodec and Identifiable."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["es8311", "everest", "codec", "audio", "dac", "adc", "i2s", "i2c", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/es8311-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.0"

[docs.pages]
"README.md" = "Playing and recording sound through an ES8311 codec"

# Every module of the package checks at the embedded tier, so a program
# of any tier, embedded, rt or system, may call it.
[tier]
tier = "embedded"

# The device program, examples/tone.nv, has no [[bin]] entry: an entry
# makes the registry list the package as a program.  tests/device_build.sh
# builds the program for two boards as the main of a scratch package that
# depends on this one.

[dependencies]
# The board's I2C handle, the I2cBus, Timer and I2s traits and the I2S
# settings.
embedded-hal-nv = "^0.3.3"
# The wiring record, the register helpers, and the AudioCodec and
# Identifiable traits.
devices-nv      = "^0.3.3"
